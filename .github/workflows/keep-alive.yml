name: Mantener Supabase activo

# Supabase pausa los proyectos del plan gratuito tras ~7 días sin actividad.
# Este flujo hace una consulta mínima a la base dos veces por semana para que
# el proyecto no se duerma. Si la consulta falla (proyecto ya pausado o caído),
# el flujo falla y GitHub envía un aviso por correo.
#
# Sobreescribible con Variables del repo (Settings → Secrets and variables →
# Actions → Variables): VITE_SUPABASE_URL y VITE_SUPABASE_ANON_KEY.

on:
  schedule:
    # lunes y jueves a las 12:00 UTC (06:00 en Costa Rica)
    - cron: '0 12 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base
        env:
          URL: ${{ vars.VITE_SUPABASE_URL || 'https://dlinpxcjobqunxbxnzgz.supabase.co' }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRsaW5weGNqb2JxdW54Ynhuemd6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1MzkzNjMsImV4cCI6MjEwMDExNTM2M30.EehcuB-cDspxyhhvfW1LNgRvlWPcG0QnrGjm2wc6BeQ' }}
        run: |
          echo "Consultando $URL …"
          codigo=$(curl -s -o /tmp/respuesta -w '%{http_code}' \
            "$URL/rest/v1/proyecto?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $codigo"
          head -c 300 /tmp/respuesta; echo
          # 200 = respondió · 401/403 = respondió pero sin permiso (también cuenta como actividad)
          if [ "$codigo" = "200" ] || [ "$codigo" = "401" ] || [ "$codigo" = "403" ]; then
            echo "✓ El proyecto está despierto."
          else
            echo "✗ El proyecto no respondió (HTTP $codigo). Puede estar pausado:"
            echo "  https://supabase.com/dashboard/project/dlinpxcjobqunxbxnzgz"
            exit 1
          fi
