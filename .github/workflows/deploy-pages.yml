name: Desplegar PWA a GitHub Pages

# Compila la app de app/ y la publica en GitHub Pages.
#
# La URL y la anon key de Supabase van como valores por defecto abajo: la anon
# key es PÚBLICA por diseño (viaja en el bundle de cualquier app cliente de
# Supabase) y lo que protege los datos son las políticas RLS de la migración,
# no ocultar esa clave. Se pueden sobreescribir con Variables del repo
# (Settings -> Secrets and variables -> Actions -> Variables) sin tocar este archivo.
#
# El paso "configure-pages" con enablement:true intenta activar Pages solo en
# la primera corrida. Si el permiso no alcanza, activarlo a mano es un clic:
# Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [claude/app-idea-docs-5jz0bc]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Activar Pages (best-effort en la primera corrida)
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /SEKstructures/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://dlinpxcjobqunxbxnzgz.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRsaW5weGNqb2JxdW54Ynhuemd6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1MzkzNjMsImV4cCI6MjEwMDExNTM2M30.EehcuB-cDspxyhhvfW1LNgRvlWPcG0QnrGjm2wc6BeQ' }}
      # SPA fallback: 404 sirve la misma app
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
